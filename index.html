<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ward Voter Data Manager</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      const preloadErrorReloadKey = 'vite-preload-error-reloaded';

      window.addEventListener('vite:preloadError', (event) => {
        if (sessionStorage.getItem(preloadErrorReloadKey)) return;
        event.preventDefault();
        sessionStorage.setItem(preloadErrorReloadKey, '1');
        window.location.reload();
      });

      window.addEventListener('load', () => {
        window.setTimeout(() => sessionStorage.removeItem(preloadErrorReloadKey), 10000);
      }, { once: true });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
